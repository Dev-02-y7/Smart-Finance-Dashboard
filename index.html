<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Smart Finance Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <!-- GOOGLE FONT -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- CHART.JS -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header class="header">

      <div>

        <h1>Smart Finance Dashboard</h1>

        <p>
          Manage income, expenses & savings intelligently
        </p>

      </div>

     <div class="header-controls">

  <select id="currencySelector">

    <option value="$">USD ($)</option>

    <option value="£">GBP (£)</option>

    <option value="€">EUR (€)</option>

    <option value="₹">INR (₹)</option>

    <option value="¥">JPY (¥)</option>

  </select>

  <button id="themeToggle">
    🌙
  </button>

</div>

    </header>

    <!-- DASHBOARD CARDS -->

    <section class="dashboard">

      <div class="card balance-card">

        <h3>Remaining Balance</h3>

        <h2 id="balance">
          $0.00
        </h2>

      </div>

      <div class="card">

        <h3>Total Income</h3>

        <h2 id="totalIncome">
          $0.00
        </h2>

      </div>

      <div class="card">

        <h3>Total Expenses</h3>

        <h2 id="totalExpense">
          $0.00
        </h2>

      </div>

      <div class="card">

        <h3>Savings Rate</h3>

        <h2 id="savingsRate">
          0%
        </h2>

      </div>

    </section>

    <!-- MAIN GRID -->

    <main class="main-grid">

      <!-- LEFT SIDE -->

      <section class="left-side">

        <!-- INCOME SECTION -->

        <div class="card">

          <h2>Add Income Source</h2>

          <form id="incomeForm">

            <input
              type="text"
              id="incomeSource"
              placeholder="Income Source"
              required
            >

            <input
              type="number"
              id="incomeAmount"
              placeholder="Monthly Amount"
              required
            >

            <button type="submit">
              Add Income
            </button>

          </form>

        </div>

        <!-- EXPENSE SECTION -->

        <div class="card">

          <h2>Add Expense</h2>

          <form id="expenseForm">

            <input
              type="text"
              id="expenseTitle"
              placeholder="Expense Title"
              required
            >

            <input
              type="number"
              id="expenseAmount"
              placeholder="Expense Amount"
              required
            >

            <select id="expenseCategory" required>

              <option value="">
                Select Category
              </option>

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Shopping">
                Shopping
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Health">
                Health
              </option>

              <option value="Other">
                Other
              </option>

            </select>

            <input
              type="date"
              id="expenseDate"
              required
            >

            <button type="submit">
              Add Expense
            </button>

          </form>

        </div>

        <!-- TRANSACTION HISTORY -->

        <div class="card history-card">

          <div class="history-header">

            <h2>Expense History</h2>

            <input
              type="text"
              id="searchInput"
              placeholder="Search expenses..."
            >

          </div>

          <ul id="expenseList"></ul>

        </div>

      </section>

      <!-- RIGHT SIDE -->

      <section class="right-side">

        <!-- ANALYTICS -->

        <div class="card analytics-card">

          <h2>Expense Analytics</h2>

          <canvas id="expenseChart"></canvas>

        </div>

        <!-- INCOME SOURCES -->

        <div class="card">

          <h2>Income Sources</h2>

          <ul id="incomeList"></ul>

        </div>

        <!-- FINANCIAL INSIGHTS -->

        <div class="card insights-card">

          <h2>Financial Insights</h2>

          <div id="insights"></div>

        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
